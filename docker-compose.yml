services:
  postgres:
    image: postgres:16-alpine
    container_name: tis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tis_user
      POSTGRES_PASSWORD: tis_password
      POSTGRES_DB: tis
    ports:
      - "5432:5432"
    volumes:
      - tis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tis_user -d tis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tis_postgres_data:
